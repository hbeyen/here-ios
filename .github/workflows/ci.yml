name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        # Simulator destination needs no code signing; CODE_SIGNING_ALLOWED=NO
        # keeps it that way even if a signed phase sneaks in.
        run: |
          xcodebuild \
            -project Here.xcodeproj \
            -scheme Here \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build
